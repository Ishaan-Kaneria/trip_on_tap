<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip On Tap | Destinations</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="nav-logo">
        <img src="images/logo.png" alt="Trip On Tap Logo">
        <span class="site-title">Trip On Tap</span>
    </div>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="destinations.html" class="active">Destinations</a>
        <a href="packages.html">Packages</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="content">
    <h2>Popular Destinations</h2>

    <!-- Search + Sort Controls -->
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search destination...">

        <select id="sortPrice">
            <option value="">Sort by Price</option>
            <option value="low">Low to High</option>
        </select>
    </div>

    <!-- Dynamic Card Grid -->
    <div class="card-grid" id="tourContainer">
        <!-- Cards will be injected here by JS -->
    </div>
</section>

<footer>
    <p>© 2026 Trip On Tap</p>
</footer>

<!-- Creepy Click Overlay -->
<div id="creepy-overlay"></div>

<!-- Creepy Sound -->
<audio id="creepy-sound">
    <source src="https://www.soundjay.com/horror/sounds/horror-ambience-01.mp3" type="audio/mpeg">
</audio>

<!-- Modular JS -->
<script type="module" src="js/main.js"></script>

</body>
</html>
