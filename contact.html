<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip On Tap | Contact Us</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="nav-logo">
        <img src="images/logo.png" alt="Trip On Tap Logo">
        <span class="site-title">Trip On Tap</span>
    </div>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="destinations.html">Destinations</a>
        <a href="packages.html">Packages</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>
</header>

<section class="content">
    <div class="form-container">
        <h2>Contact Us</h2>

        <form id="contactForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Your email" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" placeholder="Your message" required></textarea>
            </div>

            <div class="form-group">
                <input type="submit" value="Send Message" class="btn">
            </div>
        </form>
    </div>
</section>

<footer>
    <p>© 2026 Trip On Tap</p>
</footer>

<div id="creepy-overlay"></div>

<audio id="creepy-sound">
    <source src="audio/button.mp3" type="audio/mpeg">
</audio>

<script type="module" src="js/main.js"></script>

</body>
</html>
