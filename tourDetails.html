<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip On Tap | Contact Us</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="nav-logo">
            <img src="images/logo.png" alt="Logo">
            <span class="site-title">Trip On Tap</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="destinations.html">Destinations</a>
            <a href="packages.html">Packages</a>
            <a href="contact.html" class="active">Contact</a>
            <a href="wishlist.html" class="wishlist-link">❤️ <span id="wishlistCount"></span></a>
        </nav>
    </header>

    <main class="content">
        <div class="form-container">
            <h2>Get In Touch</h2>
            <p style="text-align:center; color:#888; margin-bottom: 20px;">Have questions? We're here to help!</p>
            <form id="contactForm">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" placeholder="How can we help you?" required></textarea>
                </div>
                <button type="submit" class="btn" style="width:100%;">Send Message</button>
            </form>
        </div>
    </main>

    <footer><p>© 2026 Trip On Tap</p></footer>
    <script type="module" src="js/main.js"></script>
</body>
</html>
