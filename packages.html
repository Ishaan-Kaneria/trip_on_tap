<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Trip On Tap | Packages</title>
    <link rel="icon" href="images/logo.png" type="image/png">    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="nav-logo">
            <img src="images/logo.png" alt="Logo">
            <span class="site-title">Trip On Tap</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="destinations.html">Destinations</a>
            <a href="packages.html" class="active">Packages</a>
            <a href="contact.html">Contact</a>
            <a href="wishlist.html" class="wishlist-link">❤️ <span id="wishlistCount"></span></a>
        </nav>
    </header>

    <main class="content">
        <div class="form-container">
            <h2>Book Your Travel Package</h2>
            <form id="bookingForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label>Travel Date</label>
                    <input type="date" id="travelDate" required>
                </div>
                <div class="form-group">
                    <label>Select Destination</label>
                    <select id="destinationSelect" required>
                        <option value="">-- Choose Destination --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Plan Type</label>
                    <select id="planSelect" required>
                        <option value="">-- Select Plan --</option>
                    </select>
                </div>

                <div id="totalPriceDisplay" class="total-box"></div>

                <button type="submit" class="btn" style="width:100%;">Complete Booking</button>
            </form>
            <p id="status"></p>
        </div>
    </main>

    <footer><p>© 2026 Trip On Tap</p></footer>
    <script type="module" src="js/main.js"></script>
</body>
</html>
