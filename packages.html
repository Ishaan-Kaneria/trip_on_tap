<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Trip On Tap | Packages</title>
    <link rel="icon" href="images/logo.png" type="image/png">    
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <div class="nav-logo">
        <img src="images/logo.png" alt="Logo">
        <span class="site-title">Trip On Tap</span>
    </div>

    <nav class="nav-links">
        <a href="index.html" class="active">Home</a>
        <a href="about.html">About</a>
        <a href="destinations.html">Destinations</a>
        <a href="packages.html">Packages</a>
        <a href="contact.html">Contact</a>

        <!-- ❤️ Wishlist -->
        <a href="wishlist.html" class="wishlist-link">
            ❤️ Wishlist <span id="wishlistCount">(0)</span>
        </a>
    </nav>
</header>

<main class="content">

    <h2 class="section-title">Available Plans</h2>
    <div class="card-grid" id="planCards"></div>

    <h2 class="section-title">Book Your Trip</h2>

    <div class="form-container">
        <form id="bookingForm">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" required min="1">
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            
            <div class="form-group">
                <label>Travel Date</label>
                <input type="date" id="travelDate" required>
            </div>
            
            <div class="form-group">
                <label>Number of Travelers</label>
                <input type="number" id="travelers" min="1" required readonly>
            </div>
            
            <div class="form-group">
                <label for="destination">Destination</label>
                <select id="destination" required>
                    <option value="">Select Destination</option>
                </select>
            </div>

            <div class="form-group">
                <label for="plan">Plan Type</label>
                <select id="plan" required>
                    <option value="">Select Plan</option>
                </select>
            </div>

            <div class="form-group">
                <button type="submit" class="btn">Book Now</button>
            </div>
            
            
        </form>
        
        <p id="status" class="booking-status"></p>
    </div>

</main>

<footer>
    <p>© 2026 Trip On Tap</p>
</footer>

<!-- Halloween Overlay -->
<div id="creepy-overlay"></div>

<audio id="creepy-sound">
    <source src="audio/button.mp3" type="audio/mpeg">
</audio>

<script type="module" src="js/main.js"></script>

</body>
</html>
