<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Trip On Tap | Packages</title>
    <link rel="icon" href="images/logo.png" type="image/png">    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="nav-logo">
        <img src="images/logo.png" alt="Trip On Tap Logo">
        <span class="site-title">Trip On Tap</span>
    </div>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="destinations.html">Destinations</a>
        <a href="packages.html" class="active">Packages</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="content">
    <h2>Available Plans</h2>
    <div class="card-grid" id="planCards"></div>

    <h2 style="margin-top:50px;">Book Your Trip</h2>

    <div class="form-container">
        <form id="bookingForm">

            <div class="form-group">
                <label>Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" id="age" required min="1">
            </div>

            <div class="form-group">
                <label>Destination</label>
                <select id="destination" required>
                    <option value="">Select Destination</option>
                </select>
            </div>

            <div class="form-group">
                <label>Plan Type</label>
                <select id="plan" required>
                    <option value="">Select Plan</option>
                </select>
            </div>

            <div class="form-group">
                <input type="submit" value="Book Now" class="btn">
            </div>

        </form>

        <p id="status"></p>
    </div>
</section>

<footer>
    <p>© 2026 Trip On Tap</p>
</footer>

<div id="creepy-overlay"></div>

<audio id="creepy-sound">
    <source src="audio/button.mp3" type="audio/mpeg">
</audio>

<script type="module" src="js/main.js"></script>

</body>
</html>
