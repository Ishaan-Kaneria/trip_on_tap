<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Trip On Tap | Packages</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/logo.png" type="image/png">
</head>
<body>
    <header>
        <div class="nav-logo">
            <img src="images/logo.png" alt="Logo">
            <span class="site-title">Trip On Tap</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="destinations.html">Destinations</a>
            <a href="packages.html" class="active">Packages</a>
            <a href="contact.html">Contact</a>
            <a href="wishlist.html">❤️ <span id="wishlistCount"></span></a>
        </nav>
    </header>

    <main class="content">
        <div class="form-container">
            <h1>Book Your Package</h1>
            <br><br>
            <form id="bookingForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email Id</label>
                    <input type="email" id="name" placeholder="Enter email id" required>
                </div>
                <div class="form-group">
                    <label>Date of birth</label>
                    <input type="date" id="name" placeholder="Enter date of birth" required>
                </div>
                <div class="form-group">
                    <label>Destination</label>
                    <select id="destinationSelect" required>
                        <option value="">-- Select Destination --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Plan Type</label>
                    <select id="planSelect" required>
                        <option value="">-- Select Plan --</option>
                    </select>
                </div>
                <div id="totalPriceDisplay" class="total-box"></div>
                <button type="submit" class="btn" style="width:100%;">Confirm Booking</button>
            </form>
            <p id="status" style="text-align:center; margin-top:10px; color: #ff7b00;"></p>
        </div>
    </main>

    <footer>
        <p>© 2026 Trip On Tap | Your Adventure Awaits</p>
    </footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
